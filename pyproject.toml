[tool.poetry]
name = "graphsignal"
version = "0.20.4"
description = "Graphsignal Profiler"
authors = ["Graphsignal, Inc. <devops@graphsignal.com>"]
license = "Apache-2.0"
homepage = "https://graphsignal.com"
repository = "https://graphsignal.com"
readme = "README.md"
keywords = ["Inference profiler", "CUDA profiler"]
include = [
    "graphsignal/_native/*",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.poetry.dependencies]
python = ">=3.9,<4"
xxhash = "*"
protobuf = "*"
requests = "*"
nvidia-ml-py = ">=12"
opentelemetry-proto = "*"
grpcio = "*"
psutil = ">=5.9"
prometheus-client = "*"
nvidia-cuda-cupti-cu12 = { version = ">=12,<13", optional = true, markers = "sys_platform == 'linux'" }
nvidia-cuda-cupti = { version = ">=13,<14", optional = true, markers = "sys_platform == 'linux'" }

[tool.poetry.extras]
cu12 = ["nvidia-cuda-cupti-cu12"]
cu13 = ["nvidia-cuda-cupti"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-forked = "*"

[tool.poetry.scripts]
graphsignal-run = "graphsignal.commands.graphsignal_run:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
